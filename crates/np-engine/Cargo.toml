[package]
name = "np-engine"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
np-model = { path = "../np-model" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
hudsucker = { version = "0.25", features = ["http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "webpki-roots", "aws-lc-rs"] }
webpki-roots = "1"
http-body-util = "0.1"
bytes = "1"
base64 = "0.22"
sha2 = "0.10"
futures = "0.3"
thiserror = "2"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
np-harness = { path = "../../harness" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
tokio-tungstenite = "0.26"
