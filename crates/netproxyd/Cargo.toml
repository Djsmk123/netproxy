[package]
name = "netproxyd"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "netproxyd"
path = "src/lib.rs"

[[bin]]
name = "netproxyd"
path = "src/main.rs"

[dependencies]
np-model = { path = "../np-model" }
np-engine = { path = "../np-engine" }
np-store = { path = "../np-store" }
np-mock = { path = "../np-mock" }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
tokio.workspace = true
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
libc = "0.2"
getrandom = "0.3"
bytes = "1"
base64 = "0.22"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "fmt", "env-filter"] }
notify = { version = "7", default-features = false, features = ["macos_kqueue"] }
regex = "1"
lazy_static = "1.5"

[dev-dependencies]
sha2 = "0.10"
base64 = "0.22"
np-harness = { path = "../../harness" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json"] }
tempfile = "3"
